[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allodesigner-agent"
version = "0.1.0"
description = "Contract-constrained multi-agent system for AlloDesigner cryptic allosteric workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.scripts]
allodesigner-agent = "allodesigner_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
